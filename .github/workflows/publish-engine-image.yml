name: Publish Engine Image

run-name: "protocol-simulation-engine:${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Engine image version
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build engine image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-engine-image.sh "$RELEASE_VERSION"

      - name: Push engine image
        run: docker push "vustcc/protocol-simulation-engine:${{ inputs.version }}"

      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: vustcc/protocol-simulation-engine
          readme-filepath: README.md
