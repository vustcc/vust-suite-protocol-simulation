name: Publish Image

run-name: "protocol-simulation:${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Protocol simulation image version
        required: true
        default: 0.1.0-alpha.1
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build protocol simulation image
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/build-image.sh "$RELEASE_VERSION"

      - name: Push protocol simulation image
        run: docker push "vustcc/protocol-simulation:${{ inputs.version }}"

      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: vustcc/protocol-simulation
          readme-filepath: README.md
